[package]
name = "terminal-journal"
version = "0.1.0"
description = "Terminal by Arlecchino — offline journal"
authors = ["Arlecchino"]
license = "MIT"
repository = "https://github.com/arlecchinoOPSource/Arlecchino-s-Terminal-Journal"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
