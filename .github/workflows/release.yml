name: Release builds

# Builds macOS (universal) and Windows installers after the full CI suite passes.
#  - Pushing a tag vX.Y.Z attaches the installers to a DRAFT GitHub release for
#    that tag. Nothing is published: the owner reviews and publishes it by hand.
#  - Running it manually only uploads the installers as workflow artifacts.
# Signing is used only when the repository secrets exist (docs/RELEASE.md);
# otherwise macOS builds are ad-hoc signed and Windows builds are unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-2025
            rust-targets: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Check version numbers
        shell: bash
        run: node scripts/check_version.mjs ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Use Apple signing identity when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s<<__EOF__\n%s\n__EOF__\n' "$name" "${!name}" >> "$GITHUB_ENV"
            done
            echo "Signing and notarizing with the configured Developer ID."
          else
            echo "::notice::No Apple signing secrets: building an ad-hoc signed app (not notarized)."
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Terminal ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Installers are attached below; check the signing notes in docs/RELEASE.md before publishing.
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: true
